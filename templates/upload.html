<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

{% include 'navbar.html' %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-body p-5">

                    <h1 class="text-center text-primary fw-bold">
                        🏥 MediFlow
                    </h1>

                    <p class="text-center text-muted fs-5 mb-4">
                        AI-Powered Medical Record Analyzer
                    </p>

                    <hr>

                    <form action="/upload" method="POST" enctype="multipart/form-data">

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Patient ID
                            </label>

                            <input
                                type="text"
                                class="form-control form-control-lg"
                                name="patient"
                                placeholder="Example: P001"
                                required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Upload Prescription / Medical Report
                            </label>

                            <input
                                type="file"
                                class="form-control form-control-lg"
                                name="document"
                                required>

                        </div>

                        <button
                            class="btn btn-primary btn-lg w-100"
                            type="submit">

                            Analyze Document

                        </button>

                    </form>

                    <hr class="my-5">

                    <div class="row text-center">

                        <div class="col-md-4">

                            <h2>📄</h2>
                            <h6>OCR Extraction</h6>
                            <p class="text-muted small">
                                Extract text from prescriptions automatically.
                            </p>

                        </div>

                        <div class="col-md-4">

                            <h2>🤖</h2>
                            <h6>AI Analysis</h6>
                            <p class="text-muted small">
                                Identify medicines, diagnosis and doctor details.
                            </p>

                        </div>

                        <div class="col-md-4">

                            <h2>🛡️</h2>
                            <h6>Safety Engine</h6>
                            <p class="text-muted small">
                                Detect duplicate medicines and possible conflicts.
                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
